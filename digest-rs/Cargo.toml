[package]
name = "digest-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
fancy-regex = "0.20.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[profile.release]
strip = true
